<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>Namima v3 — AW2-ish reactor</title>
  <style>
    html, body { margin:0; padding:0; overflow:hidden; background:#05060a; }
    canvas { display:block; }
    #startOverlay{
      position:fixed; inset:0;
      display:flex; align-items:center; justify-content:center;
      background:rgba(0,0,0,0.72);
      color:#e8e8e8;
      font: 16px/1.4 system-ui, -apple-system, Segoe UI, sans-serif;
      z-index:10;
      user-select:none;
      -webkit-tap-highlight-color: transparent;
    }
    #startOverlay .box{
      padding:16px 18px;
      border:1px solid rgba(255,255,255,0.16);
      border-radius:14px;
      background:rgba(10,10,14,0.55);
      max-width: 360px;
      text-align:center;
      backdrop-filter: blur(6px);
    }
    #hud{
      position:fixed; left:12px; bottom:12px;
      color: rgba(255,255,255,0.55);
      font: 12px/1.3 system-ui, -apple-system, Segoe UI, sans-serif;
      z-index:5;
      user-select:none;
    }
    .share-link-button{position:fixed;top:10px;right:10px;z-index:20;min-height:30px;border:1px solid rgba(255,255,255,.2);border-radius:999px;background:rgba(5,6,10,.5);color:rgba(255,255,255,.74);font:11px/1 system-ui,-apple-system,Segoe UI,sans-serif;letter-spacing:.08em;padding:0 9px;cursor:pointer;opacity:.66;backdrop-filter:blur(8px)}
    .share-link-button:hover,.share-link-button:focus-visible{opacity:1}
    .share-link-status{position:fixed;top:48px;right:10px;z-index:20;max-width:min(320px,calc(100vw - 20px));overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border:1px solid rgba(255,255,255,.14);border-radius:999px;background:rgba(5,6,10,.68);color:rgba(255,255,255,.68);font:10px/1.2 ui-monospace,SFMono-Regular,Consolas,monospace;padding:7px 9px;backdrop-filter:blur(8px)}
  </style>
</head>
<body>
  <button class="share-link-button" type="button" data-share-link aria-label="Share or copy this page URL">URL</button>
  <span class="share-link-status" data-share-link-status hidden></span>
  <div id="startOverlay">
    <div class="box">
      <div style="font-weight:650; margin-bottom:6px; letter-spacing:.04em;">Tap to start</div>
      <div style="opacity:.85;">iPhone 対策：音を有効化します</div>
      <div style="opacity:.65; margin-top:10px;">8 lights / n-body / audio-synced</div>
    </div>
  </div>

  <div id="hud">Namima v3 / AW2-ish reactor</div>

  <script src="https://cdn.jsdelivr.net/npm/p5@1.9.3/lib/p5.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tone@14.8.49/build/Tone.js"></script>

  <script src="./audio.js"></script>
  <script src="./sketch.js"></script>
  <script>
    (() => {
      const button = document.querySelector("[data-share-link]");
      const status = document.querySelector("[data-share-link-status]");
      if (!button) return;
      const label = button.textContent;
      const showUrl = (url) => {
        button.title = url;
        if (status) {
          status.hidden = false;
          status.textContent = url;
        }
      };
      const copyUrl = async (url) => {
        if (navigator.clipboard?.writeText) {
          await navigator.clipboard.writeText(url);
          return true;
        }
        return false;
      };
      button.addEventListener("click", async () => {
        const url = window.location.href;
        showUrl(url);
        try {
          if (navigator.share) await navigator.share({ title: document.title || "Namima Lab", url });
          else if (!(await copyUrl(url))) window.prompt("Copy URL", url);
          button.textContent = "copied";
        } catch (error) {
          if (error?.name !== "AbortError") window.prompt("Copy URL", url);
        }
        window.clearTimeout(button._shareLinkTimer);
        button._shareLinkTimer = window.setTimeout(() => {
          button.textContent = label;
          if (status) status.hidden = true;
        }, 4200);
      });
    })();
  </script>
</body>
</html>
